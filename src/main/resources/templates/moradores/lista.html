<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'moradores')}">
<head><title>Moradores</title></head>
<body>
<main>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-slate-900">Moradores</h1>
            <p class="text-sm text-slate-500 mt-1">Cadastro dos moradores vinculados às unidades.</p>
        </div>
        <a href="/moradores/novo" class="btn-primary">
            <i data-lucide="plus" class="w-4 h-4"></i> Novo Morador
        </a>
    </div>

    <div th:if="${moradores.empty}" class="card p-10 text-center">
        <i data-lucide="users" class="w-10 h-10 mx-auto text-slate-300"></i>
        <p class="mt-3 text-slate-500">Nenhum morador cadastrado.</p>
    </div>

    <div th:unless="${moradores.empty}" class="card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wide text-xs">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">Nome</th>
                    <th class="px-6 py-3 text-left font-medium">CPF</th>
                    <th class="px-6 py-3 text-left font-medium">Tipo</th>
                    <th class="px-6 py-3 text-left font-medium">Unidade</th>
                    <th class="px-6 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="m : ${moradores}" class="hover:bg-slate-50/60">
                    <td class="px-6 py-3 font-medium text-slate-900" th:text="${m.nome}"></td>
                    <td class="px-6 py-3 text-slate-600 font-mono text-xs" th:text="${m.cpf}"></td>
                    <td class="px-6 py-3"><span class="badge" th:text="${m.tipo}"></span></td>
                    <td class="px-6 py-3 text-slate-600" th:text="${m.unidade?.identificacao}"></td>
                    <td class="px-6 py-3 text-right">
                        <div class="inline-flex items-center gap-1">
                            <a th:href="@{/moradores/{id}/editar(id=${m.id})}" class="btn-link">
                                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1"></i> Editar
                            </a>
                            <form th:action="@{/moradores/{id}/excluir(id=${m.id})}" method="post" class="inline">
                                <button type="submit" class="btn-danger-ghost"
                                        onclick="return confirm('Excluir?')">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Excluir
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
