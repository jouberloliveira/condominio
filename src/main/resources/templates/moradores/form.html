<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'moradores')}">
<head><title>Morador</title></head>
<body>
<main>
    <div class="mb-6">
        <a href="/moradores" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Voltar para Moradores
        </a>
        <h1 class="text-2xl font-semibold text-slate-900 mt-2"
            th:text="${morador.id != null} ? 'Editar Morador' : 'Novo Morador'"></h1>
    </div>

    <form th:action="${morador.id != null} ? @{/moradores/{id}(id=${morador.id})} : @{/moradores}"
          th:object="${morador}" method="post"
          class="card p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 max-w-3xl">

        <div class="md:col-span-2">
            <label class="field-label">Nome *</label>
            <input type="text" th:field="*{nome}" class="input"/>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">CPF *</label>
            <input type="text" th:field="*{cpf}" maxlength="14"
                   oninput="maskCpf(this)"
                   placeholder="000.000.000-00"
                   class="input"/>
            <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Telefone</label>
            <input type="text" th:field="*{telefone}" maxlength="15"
                   oninput="maskTelefone(this)"
                   placeholder="(00) 00000-0000"
                   class="input"/>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">E-mail</label>
            <input type="email" th:field="*{email}" class="input"/>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Tipo *</label>
            <select th:field="*{tipo}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Responsável</label>
            <select th:field="*{responsavel}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="v : ${simNaoValues}" th:value="${v}" th:text="${v}"></option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Unidade *</label>
            <select th:field="*{unidade.id}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-2 border-t border-slate-100 mt-2">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i> Salvar
            </button>
            <a href="/moradores" class="btn-secondary">Cancelar</a>
        </div>
    </form>

    <script>
        function maskCpf(el) {
            let v = el.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/^(\d{3})(\d{0,3})/, '$1.$2');
            el.value = v;
        }
        function maskTelefone(el) {
            let v = el.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 6) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) v = v.replace(/^(\d{0,2})/, '($1');
            el.value = v;
        }
    </script>
</main>
</body>
</html>
