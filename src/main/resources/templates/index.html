<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'home')}">
<head><title>Dashboard · Condomínio</title></head>
<body>
<main>
    <div class="mb-8">
        <h1 class="text-2xl md:text-3xl font-semibold text-slate-900">Dashboard</h1>
        <p class="text-sm text-slate-500 mt-1">Visão geral do condomínio.</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
        <a href="/unidades" class="card p-5 hover:shadow-md transition group">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">Unidades</span>
                <span class="w-9 h-9 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </span>
            </div>
            <div class="mt-3 text-3xl font-semibold text-slate-900" th:text="${totalUnidades}">0</div>
            <div class="mt-1 text-xs text-slate-500 group-hover:text-brand-600">Gerenciar →</div>
        </a>

        <a href="/moradores" class="card p-5 hover:shadow-md transition group">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">Moradores</span>
                <span class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </span>
            </div>
            <div class="mt-3 text-3xl font-semibold text-slate-900" th:text="${totalMoradores}">0</div>
            <div class="mt-1 text-xs text-slate-500 group-hover:text-brand-600">Gerenciar →</div>
        </a>

        <a href="/visitantes" class="card p-5 hover:shadow-md transition group">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">Visitantes</span>
                <span class="w-9 h-9 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center">
                    <i data-lucide="user-plus" class="w-5 h-5"></i>
                </span>
            </div>
            <div class="mt-3 text-3xl font-semibold text-slate-900" th:text="${totalVisitantes}">0</div>
            <div class="mt-1 text-xs text-slate-500 group-hover:text-brand-600">Gerenciar →</div>
        </a>

        <a href="/reservas" class="card p-5 hover:shadow-md transition group">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">Reservas</span>
                <span class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i>
                </span>
            </div>
            <div class="mt-3 text-3xl font-semibold text-slate-900" th:text="${totalReservas}">0</div>
            <div class="mt-1 text-xs text-slate-500 group-hover:text-brand-600">Gerenciar →</div>
        </a>

        <a href="/ocorrencias" class="card p-5 hover:shadow-md transition group">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">Ocorrências</span>
                <span class="w-9 h-9 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </span>
            </div>
            <div class="mt-3 text-3xl font-semibold text-slate-900" th:text="${totalOcorrencias}">0</div>
            <div class="mt-1 text-xs text-slate-500 group-hover:text-brand-600">Gerenciar →</div>
        </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h2 class="font-semibold text-slate-900">Últimas ocorrências</h2>
                <a href="/ocorrencias" class="text-xs text-brand-600 hover:text-brand-700">Ver todas</a>
            </div>
            <div class="divide-y divide-slate-100">
                <div th:if="${ultimasOcorrencias.empty}" class="px-6 py-8 text-center text-sm text-slate-500">Nenhuma ocorrência registrada.</div>
                <div th:each="o : ${ultimasOcorrencias}" class="px-6 py-3 flex items-center justify-between">
                    <div class="min-w-0">
                        <div class="font-medium text-slate-900 truncate" th:text="${o.titulo}"></div>
                        <div class="text-xs text-slate-500" th:text="${#temporals.format(o.dataHoraAbertura, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                    <span class="badge ml-3" th:text="${o.status}"></span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h2 class="font-semibold text-slate-900">Próximas reservas</h2>
                <a href="/reservas" class="text-xs text-brand-600 hover:text-brand-700">Ver todas</a>
            </div>
            <div class="divide-y divide-slate-100">
                <div th:if="${proximasReservas.empty}" class="px-6 py-8 text-center text-sm text-slate-500">Nenhuma reserva registrada.</div>
                <div th:each="r : ${proximasReservas}" class="px-6 py-3 flex items-center justify-between">
                    <div class="min-w-0">
                        <div class="font-medium text-slate-900 truncate" th:text="${r.area}"></div>
                        <div class="text-xs text-slate-500" th:text="${r.solicitante?.nome} + ' · ' + ${#temporals.format(r.dataHoraInicio, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                    <span class="badge ml-3" th:text="${r.status}"></span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
