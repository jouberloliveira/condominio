<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'visitantes')}">
<head><title>Visitante</title></head>
<body>
<main>
    <div class="mb-6">
        <a href="/visitantes" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Voltar para Visitantes
        </a>
        <h1 class="text-2xl font-semibold text-slate-900 mt-2"
            th:text="${visitante.id != null} ? 'Editar Visitante' : 'Novo Visitante'"></h1>
    </div>

    <form th:action="${visitante.id != null} ? @{/visitantes/{id}(id=${visitante.id})} : @{/visitantes}"
          th:object="${visitante}" method="post"
          class="card p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 max-w-3xl">

        <div class="md:col-span-2">
            <label class="field-label">Nome *</label>
            <input type="text" th:field="*{nome}" class="input"/>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Documento *</label>
            <input type="text" th:field="*{documento}" class="input"/>
            <span th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Telefone</label>
            <input type="text" th:field="*{telefone}" maxlength="15"
                   oninput="maskTelefone(this)"
                   placeholder="(00) 00000-0000"
                   class="input"/>
        </div>

        <div>
            <label class="field-label">Tipo *</label>
            <select th:field="*{tipo}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Ativo</label>
            <select th:field="*{ativo}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="v : ${simNaoValues}" th:value="${v}" th:text="${v}"></option>
            </select>
        </div>

        <div>
            <label class="field-label">Unidade *</label>
            <select th:field="*{unidade.id}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div>
            <label class="field-label">Autorizado Por (Morador)</label>
            <select th:field="*{autorizadoPor.id}" class="input">
                <option value="">-- Nenhum --</option>
                <option th:each="m : ${moradores}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (CPF: ' + m.cpf + ')'}">
                </option>
            </select>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-2 border-t border-slate-100 mt-2">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i> Salvar
            </button>
            <a href="/visitantes" class="btn-secondary">Cancelar</a>
        </div>
    </form>

    <script>
        function maskTelefone(el) {
            let v = el.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 6) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) v = v.replace(/^(\d{0,2})/, '($1');
            el.value = v;
        }
    </script>
</main>
</body>
</html>
