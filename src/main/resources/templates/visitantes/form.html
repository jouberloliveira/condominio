<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Visitante</title></head>
<body>
<main>
    <h1 class="text-2xl font-bold text-gray-800 mb-6"
        th:text="${visitante.id != null} ? 'Editar Visitante' : 'Novo Visitante'"></h1>

    <form th:action="${visitante.id != null} ? @{/visitantes/{id}(id=${visitante.id})} : @{/visitantes}"
          th:object="${visitante}" method="post"
          class="bg-white shadow rounded p-6 flex flex-col gap-4">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome *</label>
            <input type="text" th:field="*{nome}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Documento *</label>
            <input type="text" th:field="*{documento}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
            <input type="text" th:field="*{telefone}" maxlength="15"
                   oninput="maskTelefone(this)"
                   placeholder="(00) 00000-0000"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
            <select th:field="*{tipo}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ativo</label>
            <select th:field="*{ativo}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="v : ${simNaoValues}" th:value="${v}" th:text="${v}"></option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Unidade *</label>
            <select th:field="*{unidade.id}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Autorizado Por (Morador)</label>
            <select th:field="*{autorizadoPor.id}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Nenhum --</option>
                <option th:each="m : ${moradores}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (CPF: ' + m.cpf + ')'}">
                </option>
            </select>
        </div>

        <div class="flex gap-3 mt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">Salvar</button>
            <a href="/visitantes"
               class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded">Cancelar</a>
        </div>
    </form>

    <script>
        function maskTelefone(el) {
            let v = el.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 6) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) v = v.replace(/^(\d{0,2})/, '($1');
            el.value = v;
        }
    </script>
</main>
</body>
</html>
