<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'unidades')}">
<head><title>Unidade</title></head>
<body>
<main>
    <div class="mb-6">
        <a href="/unidades" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Voltar para Unidades
        </a>
        <h1 class="text-2xl font-semibold text-slate-900 mt-2"
            th:text="${unidade.id != null} ? 'Editar Unidade' : 'Nova Unidade'"></h1>
    </div>

    <form th:action="${unidade.id != null} ? @{/unidades/{id}(id=${unidade.id})} : @{/unidades}"
          th:object="${unidade}" method="post"
          class="card p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 max-w-3xl">

        <div>
            <label class="field-label">Bloco *</label>
            <input type="text" th:field="*{bloco}" class="input"/>
            <span th:if="${#fields.hasErrors('bloco')}" th:errors="*{bloco}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Número *</label>
            <input type="text" th:field="*{numero}" class="input"/>
            <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Andar</label>
            <input type="text" th:field="*{andar}" class="input"/>
        </div>

        <div>
            <label class="field-label">Vaga de Garagem</label>
            <select th:field="*{vagaGaragem}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="v : ${simNaoValues}" th:value="${v}" th:text="${v}"></option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Situação *</label>
            <select th:field="*{situacao}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}" class="field-error"></span>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-2 border-t border-slate-100 mt-2">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i> Salvar
            </button>
            <a href="/unidades" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
