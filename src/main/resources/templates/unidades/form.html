<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Unidade</title></head>
<body>
<main>
    <h1 class="text-2xl font-bold text-gray-800 mb-6"
        th:text="${unidade.id != null} ? 'Editar Unidade' : 'Nova Unidade'"></h1>

    <form th:action="${unidade.id != null} ? @{/unidades/{id}(id=${unidade.id})} : @{/unidades}"
          th:object="${unidade}" method="post"
          class="bg-white shadow rounded p-6 flex flex-col gap-4">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bloco *</label>
            <input type="text" th:field="*{bloco}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('bloco')}" th:errors="*{bloco}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número *</label>
            <input type="text" th:field="*{numero}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Andar</label>
            <input type="text" th:field="*{andar}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Vaga de Garagem</label>
            <select th:field="*{vagaGaragem}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="v : ${simNaoValues}" th:value="${v}" th:text="${v}"></option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Situação *</label>
            <select th:field="*{situacao}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div class="flex gap-3 mt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">Salvar</button>
            <a href="/unidades"
               class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
