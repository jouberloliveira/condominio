<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'unidades')}">
<head><title>Unidades</title></head>
<body>
<main>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-slate-900">Unidades</h1>
            <p class="text-sm text-slate-500 mt-1">Cadastro e situação das unidades do condomínio.</p>
        </div>
        <a href="/unidades/novo" class="btn-primary">
            <i data-lucide="plus" class="w-4 h-4"></i> Nova Unidade
        </a>
    </div>

    <div th:if="${unidades.empty}" class="card p-10 text-center">
        <i data-lucide="home" class="w-10 h-10 mx-auto text-slate-300"></i>
        <p class="mt-3 text-slate-500">Nenhuma unidade cadastrada.</p>
    </div>

    <div th:unless="${unidades.empty}" class="card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wide text-xs">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">Identificação</th>
                    <th class="px-6 py-3 text-left font-medium">Bloco</th>
                    <th class="px-6 py-3 text-left font-medium">Número</th>
                    <th class="px-6 py-3 text-left font-medium">Situação</th>
                    <th class="px-6 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="u : ${unidades}" class="hover:bg-slate-50/60">
                    <td class="px-6 py-3 font-medium text-slate-900" th:text="${u.identificacao}"></td>
                    <td class="px-6 py-3 text-slate-600" th:text="${u.bloco}"></td>
                    <td class="px-6 py-3 text-slate-600" th:text="${u.numero}"></td>
                    <td class="px-6 py-3"><span class="badge" th:text="${u.situacao}"></span></td>
                    <td class="px-6 py-3 text-right">
                        <div class="inline-flex items-center gap-1">
                            <a th:href="@{/unidades/{id}/editar(id=${u.id})}" class="btn-link">
                                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1"></i> Editar
                            </a>
                            <form th:action="@{/unidades/{id}/excluir(id=${u.id})}" method="post" class="inline">
                                <button type="submit" class="btn-danger-ghost"
                                        onclick="return confirm('Excluir?')">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Excluir
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
