<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Ocorrências</title></head>
<body>
<main>
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Ocorrências</h1>
        <a href="/ocorrencias/novo" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Nova Ocorrência</a>
    </div>

    <div th:if="${ocorrencias.empty}" class="text-gray-500">Nenhuma ocorrência cadastrada.</div>

    <table th:unless="${ocorrencias.empty}" class="w-full bg-white shadow rounded">
        <thead class="bg-gray-200 text-gray-700 text-sm">
        <tr>
            <th class="px-4 py-2 text-left">Título</th>
            <th class="px-4 py-2 text-left">Tipo</th>
            <th class="px-4 py-2 text-left">Prioridade</th>
            <th class="px-4 py-2 text-left">Status</th>
            <th class="px-4 py-2 text-left">Abertura</th>
            <th class="px-4 py-2"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${ocorrencias}" class="border-t hover:bg-gray-50">
            <td class="px-4 py-2" th:text="${o.titulo}"></td>
            <td class="px-4 py-2" th:text="${o.tipo}"></td>
            <td class="px-4 py-2" th:text="${o.prioridade}"></td>
            <td class="px-4 py-2" th:text="${o.status}"></td>
            <td class="px-4 py-2" th:text="${#temporals.format(o.dataHoraAbertura, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="px-4 py-2 flex gap-2">
                <a th:href="@{/ocorrencias/{id}/editar(id=${o.id})}" class="text-blue-600 hover:underline text-sm">Editar</a>
                <form th:action="@{/ocorrencias/{id}/excluir(id=${o.id})}" method="post">
                    <button type="submit" class="text-red-600 hover:underline text-sm"
                            onclick="return confirm('Excluir?')">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
