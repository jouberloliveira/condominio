<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'ocorrencias')}">
<head><title>Ocorrências</title></head>
<body>
<main>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-slate-900">Ocorrências</h1>
            <p class="text-sm text-slate-500 mt-1">Chamados, manutenções e incidentes registrados.</p>
        </div>
        <a href="/ocorrencias/novo" class="btn-primary">
            <i data-lucide="plus" class="w-4 h-4"></i> Nova Ocorrência
        </a>
    </div>

    <div th:if="${ocorrencias.empty}" class="card p-10 text-center">
        <i data-lucide="alert-triangle" class="w-10 h-10 mx-auto text-slate-300"></i>
        <p class="mt-3 text-slate-500">Nenhuma ocorrência cadastrada.</p>
    </div>

    <div th:unless="${ocorrencias.empty}" class="card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wide text-xs">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">Título</th>
                    <th class="px-6 py-3 text-left font-medium">Tipo</th>
                    <th class="px-6 py-3 text-left font-medium">Prioridade</th>
                    <th class="px-6 py-3 text-left font-medium">Status</th>
                    <th class="px-6 py-3 text-left font-medium">Abertura</th>
                    <th class="px-6 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="o : ${ocorrencias}" class="hover:bg-slate-50/60">
                    <td class="px-6 py-3 font-medium text-slate-900" th:text="${o.titulo}"></td>
                    <td class="px-6 py-3"><span class="badge" th:text="${o.tipo}"></span></td>
                    <td class="px-6 py-3">
                        <span class="badge"
                              th:classappend="${o.prioridade?.name() == 'ALTA' or o.prioridade?.name() == 'URGENTE'} ? 'bg-rose-100 text-rose-700' : (${o.prioridade?.name() == 'MEDIA'} ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')"
                              th:text="${o.prioridade}"></span>
                    </td>
                    <td class="px-6 py-3"><span class="badge" th:text="${o.status}"></span></td>
                    <td class="px-6 py-3 text-slate-600 whitespace-nowrap" th:text="${#temporals.format(o.dataHoraAbertura, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="px-6 py-3 text-right">
                        <div class="inline-flex items-center gap-1">
                            <a th:href="@{/ocorrencias/{id}/editar(id=${o.id})}" class="btn-link">
                                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1"></i> Editar
                            </a>
                            <form th:action="@{/ocorrencias/{id}/excluir(id=${o.id})}" method="post" class="inline">
                                <button type="submit" class="btn-danger-ghost"
                                        onclick="return confirm('Excluir?')">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Excluir
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
