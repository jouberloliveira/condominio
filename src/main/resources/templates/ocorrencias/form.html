<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'ocorrencias')}">
<head><title>Ocorrência</title></head>
<body>
<main>
    <div class="mb-6">
        <a href="/ocorrencias" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Voltar para Ocorrências
        </a>
        <h1 class="text-2xl font-semibold text-slate-900 mt-2"
            th:text="${ocorrencia.id != null} ? 'Editar Ocorrência' : 'Nova Ocorrência'"></h1>
    </div>

    <form th:action="${ocorrencia.id != null} ? @{/ocorrencias/{id}(id=${ocorrencia.id})} : @{/ocorrencias}"
          th:object="${ocorrencia}" method="post"
          class="card p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 max-w-3xl">

        <div class="md:col-span-2">
            <label class="field-label">Título *</label>
            <input type="text" th:field="*{titulo}" class="input"/>
            <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Tipo *</label>
            <select th:field="*{tipo}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Prioridade *</label>
            <select th:field="*{prioridade}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option>
            </select>
            <span th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Status *</label>
            <select th:field="*{status}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Unidade</label>
            <select th:field="*{unidade.id}" class="input">
                <option value="">-- Nenhuma --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Aberto Por (Morador)</label>
            <select th:field="*{abertoPor.id}" class="input">
                <option value="">-- Nenhum --</option>
                <option th:each="m : ${moradores}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (' + m.unidade?.identificacao + ')'}">
                </option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Descrição</label>
            <textarea th:field="*{descricao}" rows="4" class="input"></textarea>
        </div>

        <div>
            <label class="field-label">Data/Hora Abertura *</label>
            <input type="datetime-local" th:field="*{dataHoraAbertura}" class="input"/>
            <span th:if="${#fields.hasErrors('dataHoraAbertura')}" th:errors="*{dataHoraAbertura}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Data/Hora Fechamento</label>
            <input type="datetime-local" th:field="*{dataHoraFechamento}" class="input"/>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-2 border-t border-slate-100 mt-2">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i> Salvar
            </button>
            <a href="/ocorrencias" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
