<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Ocorrência</title></head>
<body>
<main>
    <h1 class="text-2xl font-bold text-gray-800 mb-6"
        th:text="${ocorrencia.id != null} ? 'Editar Ocorrência' : 'Nova Ocorrência'"></h1>

    <form th:action="${ocorrencia.id != null} ? @{/ocorrencias/{id}(id=${ocorrencia.id})} : @{/ocorrencias}"
          th:object="${ocorrencia}" method="post"
          class="bg-white shadow rounded p-6 flex flex-col gap-4">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título *</label>
            <input type="text" th:field="*{titulo}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
            <select th:field="*{tipo}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Prioridade *</label>
            <select th:field="*{prioridade}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option>
            </select>
            <span th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
            <select th:field="*{status}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Selecione --</option>
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Unidade</label>
            <select th:field="*{unidade.id}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Nenhuma --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Aberto Por (Morador)</label>
            <select th:field="*{abertoPor.id}"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">-- Nenhum --</option>
                <option th:each="m : ${moradores}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (' + m.unidade?.identificacao + ')'}">
                </option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
            <textarea th:field="*{descricao}" rows="4"
                      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Data/Hora Abertura *</label>
            <input type="datetime-local" th:field="*{dataHoraAbertura}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            <span th:if="${#fields.hasErrors('dataHoraAbertura')}" th:errors="*{dataHoraAbertura}"
                  class="text-red-500 text-sm"></span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Data/Hora Fechamento</label>
            <input type="datetime-local" th:field="*{dataHoraFechamento}"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>

        <div class="flex gap-3 mt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">Salvar</button>
            <a href="/ocorrencias"
               class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
