<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'reservas')}">
<head><title>Reserva</title></head>
<body>
<main>
    <div class="mb-6">
        <a href="/reservas" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Voltar para Reservas
        </a>
        <h1 class="text-2xl font-semibold text-slate-900 mt-2"
            th:text="${reserva.id != null} ? 'Editar Reserva' : 'Nova Reserva'"></h1>
    </div>

    <form th:action="${reserva.id != null} ? @{/reservas/{id}(id=${reserva.id})} : @{/reservas}"
          th:object="${reserva}" method="post"
          class="card p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 max-w-3xl">

        <div>
            <label class="field-label">Unidade *</label>
            <select th:field="*{unidade.id}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="u : ${unidades}"
                        th:value="${u.id}"
                        th:text="${u.identificacao + ' (Bl.' + u.bloco + ' Nº' + u.numero + ')'}">
                </option>
            </select>
        </div>

        <div>
            <label class="field-label">Solicitante *</label>
            <select th:field="*{solicitante.id}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="m : ${moradores}"
                        th:value="${m.id}"
                        th:text="${m.nome + ' (' + m.unidade?.identificacao + ')'}">
                </option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Área Comum *</label>
            <select th:field="*{area}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="a : ${areas}" th:value="${a}" th:text="${a}"></option>
            </select>
            <span th:if="${#fields.hasErrors('area')}" th:errors="*{area}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Data/Hora Início *</label>
            <input type="datetime-local" th:field="*{dataHoraInicio}" class="input"/>
            <span th:if="${#fields.hasErrors('dataHoraInicio')}" th:errors="*{dataHoraInicio}" class="field-error"></span>
        </div>

        <div>
            <label class="field-label">Data/Hora Fim *</label>
            <input type="datetime-local" th:field="*{dataHoraFim}" class="input"/>
            <span th:if="${#fields.hasErrors('dataHoraFim')}" th:errors="*{dataHoraFim}" class="field-error"></span>
        </div>

        <div class="md:col-span-2">
            <label class="field-label">Status *</label>
            <select th:field="*{status}" class="input">
                <option value="">-- Selecione --</option>
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="field-error"></span>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-2 border-t border-slate-100 mt-2">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i> Salvar
            </button>
            <a href="/reservas" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
