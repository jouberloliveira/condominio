<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'reservas')}">
<head><title>Reservas</title></head>
<body>
<main>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-slate-900">Reservas</h1>
            <p class="text-sm text-slate-500 mt-1">Agenda de reservas das áreas comuns.</p>
        </div>
        <a href="/reservas/novo" class="btn-primary">
            <i data-lucide="plus" class="w-4 h-4"></i> Nova Reserva
        </a>
    </div>

    <div th:if="${reservas.empty}" class="card p-10 text-center">
        <i data-lucide="calendar-days" class="w-10 h-10 mx-auto text-slate-300"></i>
        <p class="mt-3 text-slate-500">Nenhuma reserva cadastrada.</p>
    </div>

    <div th:unless="${reservas.empty}" class="card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wide text-xs">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">Área</th>
                    <th class="px-6 py-3 text-left font-medium">Unidade</th>
                    <th class="px-6 py-3 text-left font-medium">Solicitante</th>
                    <th class="px-6 py-3 text-left font-medium">Início</th>
                    <th class="px-6 py-3 text-left font-medium">Status</th>
                    <th class="px-6 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="r : ${reservas}" class="hover:bg-slate-50/60">
                    <td class="px-6 py-3 font-medium text-slate-900" th:text="${r.area}"></td>
                    <td class="px-6 py-3 text-slate-600" th:text="${r.unidade?.identificacao}"></td>
                    <td class="px-6 py-3 text-slate-600" th:text="${r.solicitante?.nome}"></td>
                    <td class="px-6 py-3 text-slate-600 whitespace-nowrap" th:text="${#temporals.format(r.dataHoraInicio, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="px-6 py-3"><span class="badge" th:text="${r.status}"></span></td>
                    <td class="px-6 py-3 text-right">
                        <div class="inline-flex items-center gap-1">
                            <a th:href="@{/reservas/{id}/editar(id=${r.id})}" class="btn-link">
                                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1"></i> Editar
                            </a>
                            <form th:action="@{/reservas/{id}/excluir(id=${r.id})}" method="post" class="inline">
                                <button type="submit" class="btn-danger-ghost"
                                        onclick="return confirm('Excluir?')">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Excluir
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
